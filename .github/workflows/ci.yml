name: CI (manual only)
# GitHub Actions minutes are exhausted: no push/PR triggers.
# Use "npm run ci:local" on the developer's Mac instead.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm test
      - run: npm run build
